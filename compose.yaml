services:
  vrt:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.64.1-noble
        WORKDIR /app
        RUN apt-get update \
          && apt-get install -y --only-upgrade nodejs \
          && apt-get remove -y fonts-wqy-zenhei \
          && rm -rf /var/lib/apt/lists/*
        RUN npm install --global pnpm@12
        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        RUN pnpm install --frozen-lockfile
        COPY astro.config.ts tsconfig.json playwright.config.ts ./
        COPY src/ ./src/
        COPY public/ ./public/

    init: true
    ipc: host

    environment:
      CI:
      MICROCMS_SERVICE_DOMAIN: dummy_domain
      MICROCMS_API_KEY: dummy_key

    volumes:
      - ./playwright-outputs:/app/playwright-outputs
      - ./vrt:/app/vrt

    command: ["pnpm", "exec", "playwright", "test"]

  vrt-update:
    extends:
      service: vrt
    command: ["pnpm", "exec", "playwright", "test", "--update-snapshots"]
