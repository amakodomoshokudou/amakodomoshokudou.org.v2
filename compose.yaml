services:
  vrt:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.65.0-noble
        WORKDIR /app

        RUN apt-get update \
          && apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            fonts-noto-core \
            fonts-noto-mono \
          && rm -rf /var/lib/apt/lists/*
        COPY vrt/fonts.conf /etc/fonts/conf.d/99-noto-vrt.conf

        RUN npm install --global pnpm@12

        COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
        RUN pnpm install --frozen-lockfile

        COPY astro.config.ts tsconfig.json playwright.config.ts ./
        COPY src/ ./src/
        COPY public/ ./public/

    init: true
    ipc: host

    environment:
      CI:

    volumes:
      - ./playwright-outputs:/app/playwright-outputs
      - ./vrt:/app/vrt

    command: ["pnpm", "exec", "playwright", "test"]

  vrt-update:
    extends:
      service: vrt
    command: ["pnpm", "exec", "playwright", "test", "--update-snapshots"]
