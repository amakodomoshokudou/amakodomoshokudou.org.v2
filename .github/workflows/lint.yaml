name: Lint

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true # 最後のみ実行

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - parallel:
          - name: Run typecheck
            env:
              MICROCMS_SERVICE_DOMAIN: dummy_domain
              MICROCMS_API_KEY: dummy_key
            run: pnpm run typecheck

          - name: Run check
            run: pnpm run check

      - name: Build with mock
        env:
          MICROCMS_SERVICE_DOMAIN: dummy_domain
          MICROCMS_API_KEY: dummy_key
        run: pnpm run build:mock

      - name: Run HTML lint
        run: pnpm run lint:html
