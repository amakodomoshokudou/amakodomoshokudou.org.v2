name: Lint

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/deploy.yaml"
      - ".vscode/**"
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true # 最後のみ実行

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - parallel:
          - name: Run typecheck
            env:
              MICROCMS_SERVICE_DOMAIN: dummy_domain
              MICROCMS_API_KEY: dummy_key
            run: pnpm run typecheck

          - name: Run check
            run: pnpm run check

      - name: Build with mock
        env:
          MICROCMS_SERVICE_DOMAIN: dummy_domain
          MICROCMS_API_KEY: dummy_key
        run: pnpm run build:mock

      - name: Run HTML lint
        run: pnpm run lint:html
