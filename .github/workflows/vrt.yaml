name: VRT

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "issues/**"
      - ".agents/**"
      - ".vscode/**"
      - "README.md"
      - "AGENTS.md"
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run VRT
        run: docker compose run --build --rm vrt

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-outputs/
          if-no-files-found: ignore
          retention-days: 7
