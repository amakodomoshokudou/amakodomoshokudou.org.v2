version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    groups:
      app:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "tailwindcss"
          - "@tailwindcss/vite"
          - "microcms-js-sdk"
          - "sharp"
      typescript:
        patterns:
          - "typescript"
          - "@types/node"
      code-quality:
        patterns:
          - "@biomejs/biome"
          - "markuplint"
          - "prettier"
      e2e:
        patterns:
          - "@playwright/test"
